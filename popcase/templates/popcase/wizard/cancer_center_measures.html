<div class="mt-3 fw-semibold">Drive time to nearest cancer center from {{ centroid_label }} centroid</div>
<div class="ms-3">
  {% for cb in center_field %}
    {% if cb.data.value == "nci" or cb.data.value == "coc" %}
      <div class="form-check">{{ cb.tag }} <label class="form-check-label" for="{{ cb.id_for_label }}">{{ cb.choice_label }}</label></div>
    {% endif %}
  {% endfor %}
</div>
